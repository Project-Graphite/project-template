name: Probe E build fixed
on: push
jobs:
  build:
    uses: project-graphite/actions/.github/workflows/reusable-docker-build-push.yml@fix/matrix-outputs
    with:
      services: '["web"]'
      push: false
  consume:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "tag from reusable workflow: '${{ needs.build.outputs.tag }}'"
          test -n "${{ needs.build.outputs.tag }}"
